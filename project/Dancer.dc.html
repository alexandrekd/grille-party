<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes body1{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
@keyframes body2{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-18px) scaleY(1.04)}}
@keyframes body3{from{transform:translateX(-10px) rotate(-6deg)}to{transform:translateX(10px) rotate(6deg)}}
@keyframes body4{from{transform:rotate(-9deg) translateY(-2px)}to{transform:rotate(9deg) translateY(2px)}}
@keyframes body5{from{transform:translateY(2px) scaleY(.96) scaleX(1.03)}to{transform:translateY(-12px) scaleY(1.03) scaleX(.98)}}
@keyframes body6{from{transform:translateY(-14px) rotate(5deg)}to{transform:translateY(2px) rotate(-5deg)}}
@keyframes al1{from{transform:rotate(12deg)}to{transform:rotate(-34deg)}}
@keyframes ar1{from{transform:rotate(-12deg)}to{transform:rotate(34deg)}}
@keyframes al2{from{transform:rotate(-40deg)}to{transform:rotate(-155deg)}}
@keyframes ar2{from{transform:rotate(40deg)}to{transform:rotate(155deg)}}
@keyframes al3{from{transform:rotate(34deg)}to{transform:rotate(2deg)}}
@keyframes ar3{from{transform:rotate(-2deg)}to{transform:rotate(-34deg)}}
@keyframes hd1{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes hd2{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes hd3{from{transform:rotate(5deg) translateY(-3px)}to{transform:rotate(-5deg) translateY(1px)}}
@keyframes shiver{from{transform:translateX(-2px) rotate(-1.5deg)}to{transform:translateX(2px) rotate(1.5deg)}}
@keyframes laughb{from{transform:translateY(0) rotate(-3deg) scaleY(.98)}to{transform:translateY(-12px) rotate(3deg) scaleY(1.02)}}
@keyframes winjump{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-34px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes idlebob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes sweatdrop{0%{transform:translateY(-4px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(26px) scale(1);opacity:0}}
@keyframes sparkpop{0%{transform:scale(.4) rotate(0);opacity:0}40%{transform:scale(1.1) rotate(25deg);opacity:1}100%{transform:scale(.6) rotate(60deg);opacity:0}}
</style>
</helmet>
<div style="{{ wrapS }}">
  <div style="{{ innerS }}">
    <div style="{{ shadowS }}"></div>
    <div style="{{ bodyS }}">
      <div style="{{ legLS }}"></div>
      <div style="{{ legRS }}"></div>
      <div style="{{ shoeLS }}"></div>
      <div style="{{ shoeRS }}"></div>
      <div style="{{ armLS }}"></div>
      <div style="{{ armRS }}"></div>
      <div style="{{ torsoS }}"></div>
      <div style="{{ collarS }}"></div>
      <div style="{{ headGroupS }}">
        <div style="{{ hairBackS }}"></div>
        <sc-if value="{{ hasHairExtra }}" hint-placeholder-val="{{ true }}"><div style="{{ hairExtraS }}"></div></sc-if>
        <div style="{{ headS }}"></div>
        <div style="{{ hairFrontS }}"></div>
        <div style="{{ eyeLS }}"></div>
        <div style="{{ eyeRS }}"></div>
        <div style="{{ mouthS }}"></div>
        <div style="{{ blushLS }}"></div>
        <div style="{{ blushRS }}"></div>
        <sc-if value="{{ hasAccA }}" hint-placeholder-val="{{ true }}"><div style="{{ accAS }}"></div></sc-if>
        <sc-if value="{{ hasAccB }}" hint-placeholder-val="{{ true }}"><div style="{{ accBS }}"></div></sc-if>
        <sc-if value="{{ hasAccC }}" hint-placeholder-val="{{ true }}"><div style="{{ accCS }}"></div></sc-if>
        <sc-if value="{{ hands }}" hint-placeholder-val="{{ false }}"><div style="{{ handLS }}"></div></sc-if>
        <sc-if value="{{ hands }}" hint-placeholder-val="{{ false }}"><div style="{{ handRS }}"></div></sc-if>
        <sc-if value="{{ sweat }}" hint-placeholder-val="{{ false }}"><div style="{{ sweatS }}"></div></sc-if>
        <sc-if value="{{ spark }}" hint-placeholder-val="{{ false }}"><div style="{{ sparkS }}">!</div></sc-if>
      </div>
    </div>
  </div>
  <sc-if value="{{ showName }}" hint-placeholder-val="{{ true }}">
    <div style="{{ nameS }}">{{ label }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:320},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Marin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;skin&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C98B5E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F7DCC0&quot;,&quot;#F3C9A2&quot;,&quot;#C98B5E&quot;,&quot;#8A5A3B&quot;,&quot;#6E4227&quot;]},&quot;hairColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#33242E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1C1519&quot;,&quot;#33242E&quot;,&quot;#C9803A&quot;,&quot;#F7A8B8&quot;,&quot;#E6C28A&quot;]},&quot;hair&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bob&quot;,&quot;options&quot;:[&quot;afro&quot;,&quot;long&quot;,&quot;buzz&quot;,&quot;bun&quot;,&quot;curly&quot;,&quot;ponytail&quot;,&quot;bob&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;outfit&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF6B5A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FF6B5A&quot;,&quot;#FFB34D&quot;,&quot;#F7A8B8&quot;,&quot;#FFF3E8&quot;,&quot;#4A3557&quot;]},&quot;pants&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2B2136&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2B2136&quot;,&quot;#4A3557&quot;,&quot;#E8553F&quot;]},&quot;acc&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;glasses&quot;,&quot;cap&quot;,&quot;headphones&quot;,&quot;hoops&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;reaction&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dance&quot;,&quot;options&quot;:[&quot;dance&quot;,&quot;idle&quot;,&quot;caught&quot;,&quot;dodge&quot;,&quot;laugh&quot;,&quot;surprise&quot;,&quot;sad&quot;,&quot;win&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;dance&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:1.6,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0s&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showName&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const HAIR = {
  afro:   {back:'left:9px;bottom:172px;width:112px;height:108px;border-radius:50%', front:'left:30px;bottom:212px;width:70px;height:24px;border-radius:20px'},
  long:   {back:'left:15px;bottom:118px;width:100px;height:132px;border-radius:50px 50px 26px 26px', front:'left:26px;bottom:206px;width:78px;height:34px;border-radius:30px 30px 18px 6px'},
  buzz:   {back:'left:26px;bottom:200px;width:78px;height:48px;border-radius:40px 40px 4px 4px', front:'left:28px;bottom:208px;width:74px;height:18px;border-radius:14px'},
  bun:    {back:'left:22px;bottom:178px;width:86px;height:74px;border-radius:44px 44px 18px 18px', extra:'left:46px;bottom:232px;width:40px;height:40px;border-radius:50%', front:'left:32px;bottom:210px;width:66px;height:22px;border-radius:16px'},
  curly:  {back:'left:12px;bottom:180px;width:106px;height:96px;border-radius:52px 52px 34px 34px', extra:'left:6px;bottom:192px;width:44px;height:44px;border-radius:50%', front:'left:28px;bottom:210px;width:74px;height:28px;border-radius:22px'},
  ponytail:{back:'left:22px;bottom:180px;width:86px;height:72px;border-radius:44px 44px 16px 16px', extra:'left:98px;bottom:142px;width:28px;height:86px;border-radius:14px 14px 14px 14px', front:'left:30px;bottom:212px;width:70px;height:22px;border-radius:16px'},
  bob:    {back:'left:14px;bottom:166px;width:102px;height:92px;border-radius:48px 48px 26px 26px', front:'left:26px;bottom:206px;width:78px;height:32px;border-radius:26px 26px 8px 18px'}
};

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const skin = p.skin || '#F3C9A2';
    const hair = p.hairColor || '#33242E';
    const outfit = p.outfit || '#FF6B5A';
    const pants = p.pants || '#2B2136';
    const shoe = p.shoe || '#FFF3E8';
    const ink = '#2A1E2B';
    const sc = +(p.scale || 1);
    const dance = ((+(p.dance || 1) - 1) % 6) + 1;
    const delay = p.delay || '0s';
    const react = p.reaction || 'dance';
    const spd = +(p.speed || 1);
    const dur = (0.86 / spd).toFixed(2) + 's';
    const hs = HAIR[p.hair] || HAIR.bob;
    const dim = p.dim ? 'filter:brightness(.52) saturate(.75);' : '';
    const glow = p.glow ? 'filter:drop-shadow(0 0 26px rgba(255,179,77,.85));' : '';

    const armSet = ((dance - 1) % 3) + 1;
    const headSet = ((dance - 1) % 3) + 1;
    let bodyAnim = `animation:body${dance} ${dur} ${delay} infinite alternate ease-in-out;`;
    let armL = `animation:al${armSet} ${dur} ${delay} infinite alternate ease-in-out;`;
    let armR = `animation:ar${armSet} ${dur} ${delay} infinite alternate ease-in-out;`;
    let headAnim = `animation:hd${headSet} ${dur} ${delay} infinite alternate ease-in-out;`;
    let eyeW = 11, eyeH = 13, eyeR = '50%';
    let mouth = 'left:56px;bottom:174px;width:20px;height:10px;border-radius:2px 2px 14px 14px;background:' + ink;
    let blush = 0, hands = false, sweat = false, spark = false;
    let extraT = '';

    if (react === 'idle') {
      bodyAnim = `animation:idlebob ${(1.6 / spd).toFixed(2)}s ${delay} infinite alternate ease-in-out;`;
      armL = 'transform:rotate(8deg);'; armR = 'transform:rotate(-8deg);';
      headAnim = `animation:hd2 ${(1.8 / spd).toFixed(2)}s ${delay} infinite alternate ease-in-out;`;
    } else if (react === 'caught') {
      bodyAnim = 'animation:shiver .22s infinite alternate ease-in-out;';
      armL = 'transform:rotate(-118deg);'; armR = 'transform:rotate(118deg);';
      headAnim = 'transform:rotate(3deg) translateY(3px);';
      eyeH = 3; eyeR = '3px'; blush = .85; hands = true; sweat = true;
      mouth = 'left:58px;bottom:172px;width:16px;height:7px;border-radius:14px 14px 2px 2px;background:' + ink;
    } else if (react === 'dodge') {
      bodyAnim = 'animation:shiver .3s infinite alternate ease-in-out;';
      extraT = 'transform:rotate(-13deg) translateX(-8px);';
      armL = 'transform:rotate(-150deg);'; armR = 'transform:rotate(128deg);';
      headAnim = 'transform:rotate(-8deg);';
      eyeW = 13; eyeH = 14; sweat = true;
      mouth = 'left:54px;bottom:172px;width:24px;height:14px;border-radius:4px 4px 16px 16px;background:' + ink;
    } else if (react === 'laugh') {
      bodyAnim = `animation:laughb ${(0.34 / spd).toFixed(2)}s ${delay} infinite alternate ease-in-out;`;
      armL = 'transform:rotate(-58deg);'; armR = 'transform:rotate(38deg);';
      headAnim = 'animation:hd3 .34s infinite alternate ease-in-out;';
      eyeH = 4; eyeR = '4px'; blush = .5;
      mouth = 'left:52px;bottom:168px;width:28px;height:20px;border-radius:6px 6px 18px 18px;background:' + ink;
    } else if (react === 'surprise') {
      bodyAnim = 'animation:body2 .5s infinite alternate ease-in-out;';
      armL = 'transform:rotate(-142deg);'; armR = 'transform:rotate(142deg);';
      headAnim = 'transform:translateY(-4px);';
      eyeW = 16; eyeH = 18; spark = true;
      mouth = 'left:57px;bottom:168px;width:18px;height:18px;border-radius:50%;background:' + ink;
    } else if (react === 'sad') {
      bodyAnim = 'transform:translateY(6px) scaleY(.97);';
      armL = 'transform:rotate(6deg);'; armR = 'transform:rotate(-6deg);';
      headAnim = 'transform:rotate(2deg) translateY(6px);';
      eyeH = 9;
      mouth = 'left:56px;bottom:172px;width:20px;height:9px;border-radius:14px 14px 2px 2px;background:' + ink;
    } else if (react === 'win') {
      bodyAnim = `animation:winjump ${(0.62 / spd).toFixed(2)}s ${delay} infinite ease-in-out;`;
      armL = 'transform:rotate(-152deg);'; armR = 'transform:rotate(152deg);';
      headAnim = 'animation:hd1 .3s infinite alternate ease-in-out;';
      eyeH = 5; eyeR = '5px'; blush = .55;
      mouth = 'left:52px;bottom:168px;width:28px;height:19px;border-radius:6px 6px 18px 18px;background:' + ink;
    }

    const acc = p.acc || 'none';
    let accA = '', accB = '', accC = '';
    if (acc === 'glasses') {
      accA = `left:36px;bottom:182px;width:26px;height:26px;border-radius:50%;border:3px solid ${ink}`;
      accB = `left:68px;bottom:182px;width:26px;height:26px;border-radius:50%;border:3px solid ${ink}`;
      accC = `left:61px;bottom:193px;width:9px;height:3px;border-radius:2px;background:${ink}`;
    } else if (acc === 'cap') {
      accA = 'left:22px;bottom:212px;width:88px;height:32px;border-radius:44px 44px 6px 6px;background:#FF6B5A';
      accB = 'left:60px;bottom:212px;width:58px;height:13px;border-radius:0 12px 12px 0;background:#E8553F';
    } else if (acc === 'headphones') {
      accA = 'left:26px;bottom:230px;width:80px;height:14px;border-radius:14px;background:#4A3557';
      accB = 'left:18px;bottom:192px;width:20px;height:30px;border-radius:9px;background:#FFB34D';
      accC = 'left:94px;bottom:192px;width:20px;height:30px;border-radius:9px;background:#FFB34D';
    } else if (acc === 'hoops') {
      accA = 'left:22px;bottom:178px;width:15px;height:15px;border-radius:50%;border:3px solid #FFB34D';
      accB = 'left:95px;bottom:178px;width:15px;height:15px;border-radius:50%;border:3px solid #FFB34D';
    }

    const ab = 'position:absolute;';
    return {
      label: p.label || '',
      showName: p.showName !== false && !!p.label,
      hasHairExtra: !!hs.extra,
      hasAccA: !!accA, hasAccB: !!accB, hasAccC: !!accC,
      hands, sweat, spark,
      wrapS: `position:relative;width:${Math.round(130 * sc)}px;height:${Math.round(250 * sc)}px;flex:0 0 auto;${dim}${glow}`,
      innerS: `position:absolute;left:0;bottom:0;width:130px;height:250px;transform:scale(${sc});transform-origin:left bottom;`,
      shadowS: ab + 'left:14px;bottom:-4px;width:102px;height:20px;border-radius:50%;background:rgba(10,6,16,.5);filter:blur(4px);',
      bodyS: `position:absolute;left:0;bottom:0;width:130px;height:250px;transform-origin:65px 240px;${extraT}${bodyAnim}`,
      legLS: ab + `left:38px;bottom:8px;width:23px;height:68px;border-radius:12px;background:${pants};`,
      legRS: ab + `left:69px;bottom:8px;width:23px;height:68px;border-radius:12px;background:${pants};`,
      shoeLS: ab + `left:32px;bottom:0;width:34px;height:17px;border-radius:10px 12px 8px 8px;background:${shoe};`,
      shoeRS: ab + `left:64px;bottom:0;width:34px;height:17px;border-radius:12px 10px 8px 8px;background:${shoe};`,
      torsoS: ab + `left:27px;bottom:66px;width:76px;height:102px;border-radius:38px 38px 22px 22px;background:${outfit};`,
      collarS: ab + `left:52px;bottom:158px;width:26px;height:18px;border-radius:9px;background:${skin};`,
      armLS: ab + `left:17px;bottom:96px;width:20px;height:76px;border-radius:11px;background:${outfit};transform-origin:10px 9px;${armL}`,
      armRS: ab + `left:93px;bottom:96px;width:20px;height:76px;border-radius:11px;background:${outfit};transform-origin:10px 9px;${armR}`,
      headGroupS: `position:absolute;left:0;bottom:0;width:130px;height:250px;transform-origin:65px 60px;${headAnim}`,
      hairBackS: ab + hs.back + `;background:${hair};`,
      hairExtraS: ab + (hs.extra || 'display:none') + `;background:${hair};`,
      headS: ab + `left:28px;bottom:152px;width:74px;height:80px;border-radius:50%;background:${skin};`,
      hairFrontS: ab + hs.front + `;background:${hair};`,
      eyeLS: ab + `left:${45 - (eyeW - 11) / 2}px;bottom:190px;width:${eyeW}px;height:${eyeH}px;border-radius:${eyeR};background:${ink};`,
      eyeRS: ab + `left:${74 - (eyeW - 11) / 2}px;bottom:190px;width:${eyeW}px;height:${eyeH}px;border-radius:${eyeR};background:${ink};`,
      mouthS: ab + mouth + ';',
      blushLS: ab + `left:34px;bottom:178px;width:16px;height:9px;border-radius:50%;background:#FF6B5A;opacity:${blush};`,
      blushRS: ab + `left:80px;bottom:178px;width:16px;height:9px;border-radius:50%;background:#FF6B5A;opacity:${blush};`,
      accAS: ab + accA + ';',
      accBS: ab + accB + ';',
      accCS: ab + accC + ';',
      handLS: ab + `left:28px;bottom:170px;width:38px;height:36px;border-radius:16px;background:${skin};box-shadow:0 -2px 0 rgba(0,0,0,.12) inset;`,
      handRS: ab + `left:64px;bottom:170px;width:38px;height:36px;border-radius:16px;background:${skin};box-shadow:0 -2px 0 rgba(0,0,0,.12) inset;`,
      sweatS: ab + 'left:100px;bottom:216px;width:11px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#9AD9FF;animation:sweatdrop 1.1s infinite ease-in;',
      sparkS: ab + "left:98px;bottom:224px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#FFB34D;font:800 22px 'Fredoka',sans-serif;animation:sparkpop .9s infinite ease-out;",
      nameS: "position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);white-space:nowrap;font:700 19px 'Fredoka',system-ui,sans-serif;color:#2A1E2B;background:#FFF3E8;padding:4px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.25);"
    };
  }
}
</script>
</body>
</html>
